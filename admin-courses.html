<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Cursos - Admin DoveLingua</title>
<link rel="icon" type="image/png" sizes="32x32" href="https://download.dovelingua.com/website/Favicon_32x32.png">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root{
  --navy:#0B2E73;--navy-d:#082154;--gold:#C9971A;--white:#FFFFFF;
  --grey:#F4F4F4;--tint:#E8EEF9;--teal:#0E8F7F;
  --text:#1a2332;--mid:#4a5568;--light:#718096;--border:#e2e8f0;
  --r:14px;--shadow:0 4px 20px rgba(11,46,115,.08);
  --amber:#b45309;--amber-bg:#fef3e2;--red:#c0392b;--red-bg:#fdecea;--green:#0E8F7F;--green-bg:#e6f6f4;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Inter',Arial,sans-serif;color:var(--text);background:var(--grey);line-height:1.6;}
a{text-decoration:none;color:inherit;}
button,input,select,textarea{font-family:inherit;}

/* ═══ SHARED ADMIN SHELL ═══ */
.app{display:flex;min-height:100vh;}
.sidebar{width:250px;background:var(--navy);flex-shrink:0;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;}
.sb-logo{padding:20px 18px;border-bottom:1px solid rgba(255,255,255,.1);}
.sb-logo img{height:38px;}
.sb-nav{flex:1;padding:14px 0;overflow-y:auto;}
.sb-nav a{display:flex;align-items:center;gap:12px;padding:12px 18px;font-size:13px;color:rgba(255,255,255,.65);cursor:pointer;border-left:3px solid transparent;transition:.15s;}
.sb-nav a:hover{background:rgba(255,255,255,.05);color:#fff;}
.sb-nav a.active{background:rgba(255,255,255,.08);color:var(--gold);border-left-color:var(--gold);}
.sb-nav a i{width:18px;text-align:center;}
.sb-section-label{padding:16px 18px 6px;font-size:10px;font-weight:700;color:rgba(255,255,255,.3);text-transform:uppercase;letter-spacing:1px;}
.sb-foot{padding:16px 18px;border-top:1px solid rgba(255,255,255,.1);}
.sb-foot .admin-name{font-size:12.5px;color:#fff;font-weight:600;}
.sb-foot .admin-role{font-size:10.5px;color:rgba(255,255,255,.4);}
.sb-foot a{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:12px;color:rgba(255,255,255,.5);cursor:pointer;}
.sb-foot a:hover{color:#fff;}

.main{flex:1;min-width:0;}
.topbar{background:var(--white);border-bottom:1px solid var(--border);padding:16px 28px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;position:sticky;top:0;z-index:40;}
.topbar h1{font-family:'Playfair Display',serif;font-size:19px;color:var(--navy);}
.topbar .tb-sub{font-size:12px;color:var(--light);}
.hamburger-mobile{display:none;background:none;border:none;font-size:20px;color:var(--navy);cursor:pointer;}
.content{padding:24px 28px 60px;}

.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 20px;border-radius:20px;font-size:13px;font-weight:600;border:none;cursor:pointer;transition:.2s;white-space:nowrap;}
.btn-g{background:var(--navy);color:#fff;}
.btn-g:hover{background:var(--gold);color:var(--navy);}
.btn-o{background:transparent;color:var(--navy);border:1.5px solid var(--navy);}
.btn-sm{padding:6px 14px;font-size:11.5px;}
.toast{position:fixed;bottom:24px;right:24px;background:var(--navy);color:#fff;padding:14px 22px;border-radius:12px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.3);display:flex;align-items:center;gap:10px;z-index:600;transform:translateY(100px);opacity:0;transition:.3s;}
.toast.show{transform:translateY(0);opacity:1;}

/* PAGE SPECIFIC */
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px;}
.stat-box{background:var(--white);border-radius:var(--r);border:1px solid var(--border);box-shadow:var(--shadow);padding:18px 20px;}
.stat-box .sv{font-family:'Playfair Display',serif;font-size:24px;color:var(--navy);font-weight:700;}
.stat-box .sl{font-size:11px;color:var(--light);font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-top:2px;}

.course-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;}
.course-card{background:var(--white);border-radius:var(--r);border:1px solid var(--border);box-shadow:var(--shadow);overflow:hidden;}
.cc-top{padding:14px 18px;background:var(--navy);display:flex;justify-content:space-between;align-items:center;}
.cc-cefr{background:var(--gold);color:var(--navy);font-size:11px;font-weight:700;padding:3px 12px;border-radius:10px;}
.cc-status{font-size:10.5px;font-weight:700;padding:3px 10px;border-radius:10px;}
.cc-status.open{background:var(--green-bg);color:var(--green);}
.cc-status.closed{background:var(--red-bg);color:var(--red);}
.cc-body{padding:16px 18px;}
.cc-name{font-size:15px;font-weight:700;color:var(--navy);margin-bottom:4px;}
.cc-meta{font-size:11.5px;color:var(--light);margin-bottom:12px;}
.cc-row{display:flex;justify-content:space-between;font-size:12px;padding:5px 0;border-top:1px solid var(--grey);}
.cc-row span:first-child{color:var(--light);}
.cc-row span:last-child{font-weight:600;color:var(--text);}
.cc-actions{display:flex;gap:8px;margin-top:12px;}
.icon-btn{width:32px;height:32px;border-radius:8px;background:var(--grey);border:none;color:var(--mid);cursor:pointer;display:flex;align-items:center;justify-content:center;}
.icon-btn:hover{background:var(--navy);color:#fff;}

.modal-ov{display:none;position:fixed;inset:0;background:rgba(11,46,115,.5);z-index:500;align-items:center;justify-content:center;padding:16px;}
.modal-ov.show{display:flex;}
.modal{background:var(--white);border-radius:var(--r);max-width:480px;width:100%;max-height:90vh;overflow-y:auto;}
.modal-hdr{padding:20px 24px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;}
.modal-hdr h3{font-family:'Playfair Display',serif;font-size:16px;color:var(--navy);}
.modal-close{width:30px;height:30px;border-radius:8px;background:var(--grey);border:none;cursor:pointer;}
.modal-body{padding:20px 24px;display:flex;flex-direction:column;gap:14px;}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.form-group label{display:block;font-size:11px;font-weight:700;color:var(--mid);text-transform:uppercase;margin-bottom:6px;}
.form-group input,.form-group select{width:100%;padding:10px 14px;border:1.5px solid var(--border);border-radius:10px;font-size:13.5px;outline:none;}
.modal-ftr{padding:16px 24px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px;}

@media(max-width:800px){.sidebar{position:fixed;left:-260px;z-index:200;transition:left .25s;}.sidebar.open{left:0;}.hamburger-mobile{display:block;}.stats-row{grid-template-columns:1fr 1fr;}.form-row{grid-template-columns:1fr;}}
</style>
</head>
<body>

<div class="app">
  <div class="sidebar" id="sidebar">
    <div class="sb-logo"><img src="https://download.dovelingua.com/website/Master_Wordmark_white_tex_navy_background.png" alt="DoveLingua"></div>
    <div class="sb-nav">
      <div class="sb-section-label">Gestão</div>
      <a onclick="location.href='admin-dashboard.html'"><i class="fa-solid fa-gauge"></i> Painel Geral</a>
      <a onclick="location.href='admin-users.html'"><i class="fa-solid fa-users"></i> Utilizadores</a>
      <a class="active"><i class="fa-solid fa-graduation-cap"></i> Cursos</a>
      <div class="sb-section-label">Avaliação</div>
      <a onclick="location.href='admin-level-test-editor.html'"><i class="fa-solid fa-clipboard-question"></i> Editor de Testes</a>
      <a onclick="location.href='admin-announcements.html'"><i class="fa-solid fa-bullhorn"></i> Avisos</a>
      <a onclick="location.href='admin-documents.html'"><i class="fa-solid fa-folder"></i> Documentos</a>
    </div>
    <div class="sb-foot"><div class="admin-name" id="adminName">Admin</div><div class="admin-role">Administrador</div><a id="logoutBtn"><i class="fa-solid fa-right-from-bracket"></i> Sair</a></div>
  </div>

  <div class="main">
    <div class="topbar">
      <div style="display:flex;align-items:center;gap:12px;">
        <button class="hamburger-mobile" onclick="document.getElementById('sidebar').classList.toggle('open')"><i class="fa-solid fa-bars"></i></button>
        <div><h1>Cursos</h1><div class="tb-sub">Gerir níveis, professores atribuídos e preços</div></div>
      </div>
      <button class="btn btn-g" onclick="openModal()"><i class="fa-solid fa-plus"></i> Novo Curso</button>
    </div>

    <div class="content">
      <div class="stats-row">
        <div class="stat-box"><div class="sv" id="statTotal">0</div><div class="sl">Total de Cursos</div></div>
        <div class="stat-box"><div class="sv" id="statOpen">0</div><div class="sl">Abertos</div></div>
        <div class="stat-box"><div class="sv" id="statStudents">0</div><div class="sl">Alunos Inscritos</div></div>
        <div class="stat-box"><div class="sv" id="statTeachers">0</div><div class="sl">Professores Atribuídos</div></div>
      </div>
      <div class="course-grid" id="courseGrid"></div>
    </div>
  </div>
</div>

<div class="modal-ov" id="courseModal">
  <div class="modal">
    <div class="modal-hdr"><h3 id="modalTitle">Novo Curso</h3><button class="modal-close" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button></div>
    <div class="modal-body">
      <div class="form-row">
        <div class="form-group"><label>Nível CEFR</label><select id="fCefr"><option>Pre-A1</option><option>A1</option><option>A2</option><option>A2+</option><option>B1</option><option>B2</option><option>C1</option></select></div>
        <div class="form-group"><label>Nome do Nível</label><input type="text" id="fName" placeholder="Ex: Beginner"/></div>
      </div>
      <div class="form-group"><label>Professor Atribuído</label><select id="fTeacher"><option value="">— Nenhum —</option></select></div>
      <div class="form-row">
        <div class="form-group"><label>Preço Mensal (MZN)</label><input type="number" id="fMonthly" placeholder="600"/></div>
        <div class="form-group"><label>Preço Completo (MZN)</label><input type="number" id="fFull" placeholder="1665"/></div>
      </div>
      <div class="form-group"><label>Estado</label><select id="fStatus"><option value="open">Aberto</option><option value="closed">Fechado</option></select></div>
    </div>
    <div class="modal-ftr"><button class="btn btn-o" onclick="closeModal()">Cancelar</button><button class="btn btn-g" onclick="saveCourse()"><i class="fa-solid fa-floppy-disk"></i> Guardar</button></div>
  </div>
</div>
<div class="toast" id="toast"><span id="toastText"></span></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-auth.js";
import { getFirestore, collection, doc, setDoc, addDoc, getDocs, getDoc, query, where } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore.js";

const firebaseConfig = { apiKey:"AIzaSyAl9A_gXDKTB3N6U1f_Bh5FWrOsySjCJGo", authDomain:"dovelingua-site.firebaseapp.com", projectId:"dovelingua-site", storageBucket:"dovelingua-site.firebasestorage.app", messagingSenderId:"271742052334", appId:"1:271742052334:web:bc736373d7ea50001b50ff", measurementId:"G-N8ELT8SMYM" };
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
let editingId = null, teachers = [];

onAuthStateChanged(auth, async (user) => {
  if (!user) { window.location.href='auth.html'; return; }
  const snap = await getDoc(doc(db,'users',user.uid));
  if (!snap.exists() || snap.data().role !== 'admin') { window.location.href='unauthorized.html'; return; }
  document.getElementById('adminName').textContent = snap.data().fullName || 'Admin';
  loadTeachers();
  loadCourses();
});
document.getElementById('logoutBtn').addEventListener('click', async () => { await signOut(auth); window.location.href='index.html'; });

async function loadTeachers() {
  const q = query(collection(db,'users'), where('role','==','teacher'));
  const snap = await getDocs(q);
  teachers = [];
  snap.forEach(d => teachers.push({ id:d.id, ...d.data() }));
  document.getElementById('fTeacher').innerHTML = '<option value="">— Nenhum —</option>' + teachers.map(t=>`<option value="${t.id}">${t.fullName}</option>`).join('');
}

async function loadCourses() {
  const snap = await getDocs(collection(db,'courses'));
  const grid = document.getElementById('courseGrid');
  let total=0, open=0, students=0, teacherSet=new Set();
  const cards = [];
  snap.forEach(d => {
    const c = d.data(); total++;
    if (c.status==='open') open++;
    students += c.studentCount||0;
    if (c.teacherId) teacherSet.add(c.teacherId);
    const teacherName = teachers.find(t=>t.id===c.teacherId)?.fullName || 'Não atribuído';
    cards.push(`<div class="course-card">
      <div class="cc-top"><span class="cc-cefr">${c.cefr}</span><span class="cc-status ${c.status}">${c.status==='open'?'Aberto':'Fechado'}</span></div>
      <div class="cc-body">
        <div class="cc-name">${c.name}</div>
        <div class="cc-meta">Professor: ${teacherName}</div>
        <div class="cc-row"><span>Mensal</span><span>${(c.monthly||0).toLocaleString('pt-MZ')} MZN</span></div>
        <div class="cc-row"><span>Completo</span><span>${(c.full||0).toLocaleString('pt-MZ')} MZN</span></div>
        <div class="cc-row"><span>Alunos</span><span>${c.studentCount||0}</span></div>
        <div class="cc-actions"><button class="icon-btn" onclick='editCourse("${d.id}")'><i class="fa-solid fa-pen"></i></button></div>
      </div></div>`);
  });
  grid.innerHTML = cards.join('') || '<p style="color:var(--light);grid-column:1/-1;text-align:center;padding:40px;">Nenhum curso criado ainda.</p>';
  document.getElementById('statTotal').textContent = total;
  document.getElementById('statOpen').textContent = open;
  document.getElementById('statStudents').textContent = students;
  document.getElementById('statTeachers').textContent = teacherSet.size;
  window._courses = {}; snap.forEach(d=>window._courses[d.id]=d.data());
}

window.openModal = function() { editingId=null; document.getElementById('modalTitle').textContent='Novo Curso'; document.getElementById('courseModal').classList.add('show'); };
window.closeModal = function() { document.getElementById('courseModal').classList.remove('show'); };
window.editCourse = function(id) {
  const c = window._courses[id]; editingId=id;
  document.getElementById('modalTitle').textContent='Editar Curso';
  document.getElementById('fCefr').value=c.cefr; document.getElementById('fName').value=c.name;
  document.getElementById('fTeacher').value=c.teacherId||''; document.getElementById('fMonthly').value=c.monthly;
  document.getElementById('fFull').value=c.full; document.getElementById('fStatus').value=c.status;
  document.getElementById('courseModal').classList.add('show');
};
window.saveCourse = async function() {
  const data = { cefr:document.getElementById('fCefr').value, name:document.getElementById('fName').value, teacherId:document.getElementById('fTeacher').value, monthly:+document.getElementById('fMonthly').value, full:+document.getElementById('fFull').value, status:document.getElementById('fStatus').value };
  try {
    if (editingId) await setDoc(doc(db,'courses',editingId), data, { merge:true });
    else await addDoc(collection(db,'courses'), { ...data, studentCount:0 });
    showToast('Curso guardado com sucesso.'); closeModal(); loadCourses();
  } catch(e) { showToast('Erro ao guardar.'); }
};
function showToast(t) { const el=document.getElementById('toast'); el.classList.add('show'); document.getElementById('toastText').textContent=t; setTimeout(()=>el.classList.remove('show'),3000); }
</script>
<script src="/key-lock.js"></script>
</body>
</html>
