<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Documentos - DoveLingua</title>
<link rel="icon" type="image/png" sizes="32x32" href="https://download.dovelingua.com/website/Favicon_32x32.png">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root{
  --navy:#0B2E73;--navy-d:#082154;--gold:#C9971A;--white:#FFFFFF;
  --grey:#F4F4F4;--tint:#E8EEF9;--teal:#0E8F7F;
  --text:#1a2332;--mid:#4a5568;--light:#718096;--border:#e2e8f0;
  --r:16px;--shadow:0 4px 20px rgba(11,46,115,.08);
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Inter',Arial,sans-serif;color:var(--text);background:var(--grey);line-height:1.6;}
a{text-decoration:none;color:inherit;}
button,input{font-family:inherit;}

nav{position:sticky;top:0;z-index:999;background:var(--white);border-bottom:1px solid var(--border);padding:0 clamp(1rem,4vw,2.5rem);height:74px;display:flex;align-items:center;justify-content:space-between;}
.nav-brand img{height:48px;}
.back-link{font-size:.82rem;color:var(--light);display:flex;align-items:center;gap:6px;cursor:pointer;}
.back-link:hover{color:var(--navy);}

.wrap{max-width:900px;margin:0 auto;padding:28px 5% 60px;}
.page-hdr h1{font-family:'Playfair Display',serif;font-size:clamp(19px,2.6vw,24px);color:var(--navy);margin-bottom:16px;}

.filter-row{display:flex;gap:8px;margin-bottom:20px;overflow-x:auto;}
.filter-chip{padding:8px 18px;border-radius:20px;background:var(--white);border:1.5px solid var(--border);font-size:12.5px;font-weight:600;color:var(--mid);cursor:pointer;white-space:nowrap;}
.filter-chip.active{background:var(--navy);color:#fff;border-color:var(--navy);}

.doc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;}
.doc-card{background:var(--white);border-radius:var(--r);border:1px solid var(--border);box-shadow:var(--shadow);padding:18px;display:flex;gap:14px;align-items:flex-start;transition:.2s;}
.doc-card:hover{border-color:var(--gold);}
.doc-icon{width:44px;height:44px;border-radius:10px;background:var(--tint);color:var(--navy);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
.doc-body{flex:1;min-width:0;}
.doc-title{font-size:13.5px;font-weight:700;color:var(--navy);margin-bottom:3px;}
.doc-meta{font-size:11px;color:var(--light);margin-bottom:10px;}
.doc-link{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--teal);}
.doc-link:hover{text-decoration:underline;}
.empty-state{grid-column:1/-1;padding:60px 20px;text-align:center;color:var(--light);}
.empty-state i{font-size:36px;margin-bottom:14px;display:block;color:var(--tint);}
</style>
</head>
<body>

<nav>
  <a href="index.html" class="nav-brand"><img src="https://download.dovelingua.com/website/Master_Wordmar_original.png" alt="DoveLingua"></a>
  <a class="back-link" id="backBtn"><i class="fa-solid fa-arrow-left"></i> Painel</a>
</nav>

<div class="wrap">
  <div class="page-hdr"><h1><i class="fa-solid fa-folder-open" style="color:var(--gold);margin-right:8px;"></i>Documentos</h1></div>
  <div class="filter-row">
    <div class="filter-chip active" data-cat="all" onclick="filterDocs('all',this)">Todos</div>
    <div class="filter-chip" data-cat="academic" onclick="filterDocs('academic',this)">Académico</div>
    <div class="filter-chip" data-cat="administrative" onclick="filterDocs('administrative',this)">Administrativo</div>
    <div class="filter-chip" data-cat="general" onclick="filterDocs('general',this)">Geral</div>
  </div>
  <div class="doc-grid" id="docGrid"><div class="empty-state"><i class="fa-solid fa-folder"></i><p>A carregar documentos...</p></div></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-auth.js";
import { getFirestore, doc, getDoc, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore.js";

const firebaseConfig = { apiKey:"AIzaSyAl9A_gXDKTB3N6U1f_Bh5FWrOsySjCJGo", authDomain:"dovelingua-site.firebaseapp.com", projectId:"dovelingua-site", storageBucket:"dovelingua-site.firebasestorage.app", messagingSenderId:"271742052334", appId:"1:271742052334:web:bc736373d7ea50001b50ff", measurementId:"G-N8ELT8SMYM" };
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const ROUTES = { applicant:'application-status.html', student:'student-dashboard.html', teacher:'teacher-dashboard.html', staff:'staff-payments.html', admin:'admin-dashboard.html' };
let allDocs = [];

onAuthStateChanged(auth, async (user) => {
  if (!user) { window.location.href='auth.html'; return; }
  try {
    const snap = await getDoc(doc(db,'users',user.uid));
    if (!snap.exists()) { window.location.href='auth.html'; return; }
    const data = snap.data();
    document.getElementById('backBtn').onclick = () => window.location.href = ROUTES[data.role] || 'index.html';
    const visibility = data.role === 'admin' ? null : (data.role === 'student' ? 'student' : data.role === 'teacher' ? 'teacher' : 'public');
    let docsQuery;
    if (data.role === 'admin') docsQuery = collection(db,'documents');
    else docsQuery = query(collection(db,'documents'), where('visibility','in',[visibility,'public']));
    const docSnap = await getDocs(docsQuery);
    allDocs = [];
    docSnap.forEach(d => allDocs.push(d.data()));
    renderDocs('all');
  } catch(e) { console.error(e); renderDocs('all'); }
});

const icons = { academic:'fa-graduation-cap', administrative:'fa-file-invoice', general:'fa-file-lines' };
window.filterDocs = function(cat, el) {
  document.querySelectorAll('.filter-chip').forEach(c=>c.classList.remove('active'));
  el.classList.add('active');
  renderDocs(cat);
};
function renderDocs(cat) {
  const filtered = cat==='all' ? allDocs : allDocs.filter(d=>d.category===cat);
  const grid = document.getElementById('docGrid');
  if (filtered.length===0) { grid.innerHTML = '<div class="empty-state"><i class="fa-solid fa-folder-open"></i><p>Nenhum documento disponível nesta categoria.</p></div>'; return; }
  grid.innerHTML = filtered.map(d => `
    <div class="doc-card">
      <div class="doc-icon"><i class="fa-solid ${icons[d.category]||'fa-file'}"></i></div>
      <div class="doc-body">
        <div class="doc-title">${d.title||'Documento'}</div>
        <div class="doc-meta">${d.uploadedAt ? new Date(d.uploadedAt.seconds*1000).toLocaleDateString('pt-PT') : ''}</div>
        <a href="${d.fileLink}" target="_blank" class="doc-link"><i class="fa-solid fa-download"></i> Abrir Documento</a>
      </div>
    </div>`).join('');
}
</script>
<script src="/key-lock.js"></script>
</body>
</html>
