<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Verificar Certificado - DoveLingua</title>
<link rel="icon" type="image/png" sizes="32x32" href="https://download.dovelingua.com/website/Favicon_32x32.png">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root{
  --navy:#0B2E73;--navy-d:#082154;--gold:#C9971A;--white:#FFFFFF;
  --grey:#F4F4F4;--tint:#E8EEF9;--text:#1a2332;--mid:#4a5568;--light:#718096;--border:#e2e8f0;
  --r:16px;--shadow:0 4px 20px rgba(11,46,115,.08);--green:#0E8F7F;--green-bg:#e6f6f4;--red:#c0392b;--red-bg:#fdecea;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Inter',Arial,sans-serif;color:var(--text);background:var(--grey);line-height:1.6;}
a{text-decoration:none;color:inherit;}
button,input{font-family:inherit;}

nav{background:var(--white);border-bottom:1px solid var(--border);padding:0 5%;height:70px;display:flex;align-items:center;justify-content:center;}
.nav-brand img{height:44px;}

.hero{background:linear-gradient(150deg,var(--navy-d),var(--navy));padding:40px 5% 32px;text-align:center;}
.hero h1{font-family:'Playfair Display',serif;font-size:clamp(19px,3vw,26px);color:#fff;margin-bottom:8px;}
.hero p{font-size:12.5px;color:rgba(255,255,255,.65);}

.wrap{max-width:600px;margin:0 auto;padding:26px 5% 60px;}
.search-card{background:var(--white);border-radius:var(--r);border:1px solid var(--border);box-shadow:var(--shadow);padding:24px;margin-bottom:20px;}
.search-row{display:flex;gap:10px;}
.search-row input{flex:1;padding:12px 16px;border:1.5px solid var(--border);border-radius:10px;font-size:14px;outline:none;letter-spacing:.5px;}
.search-row input:focus{border-color:var(--navy);}
.search-btn{background:var(--navy);color:#fff;border:none;border-radius:10px;padding:12px 22px;font-size:13px;font-weight:700;cursor:pointer;}
.search-btn:hover{background:var(--gold);color:var(--navy);}

.result-card{display:none;background:var(--white);border-radius:var(--r);border:1px solid var(--border);box-shadow:var(--shadow);overflow:hidden;}
.result-hdr{padding:20px;text-align:center;}
.result-hdr.valid{background:var(--green-bg);}
.result-hdr.invalid{background:var(--red-bg);}
.result-hdr i{font-size:40px;margin-bottom:10px;}
.result-hdr.valid i{color:var(--green);}
.result-hdr.invalid i{color:var(--red);}
.result-hdr h3{font-size:16px;}
.result-hdr.valid h3{color:var(--green);}
.result-hdr.invalid h3{color:var(--red);}
.result-body{padding:20px 24px;}
.dr{display:flex;justify-content:space-between;font-size:13px;padding:8px 0;border-bottom:1px solid var(--grey);}
.dk{font-weight:700;color:var(--navy);}
.dv{color:var(--mid);text-align:right;}
.privacy-note{font-size:11px;color:var(--light);text-align:center;margin-top:16px;line-height:1.6;}
</style>
</head>
<body>

<nav><a href="index.html" class="nav-brand"><img src="https://download.dovelingua.com/website/Master_Wordmar_original.png" alt="DoveLingua"></a></nav>

<div class="hero">
  <h1><i class="fa-solid fa-shield-halved" style="color:var(--gold);margin-right:8px;"></i>Verificação de Certificado</h1>
  <p>Confirme a autenticidade de um Certificado de Reconhecimento DoveLingua</p>
</div>

<div class="wrap">
  <div class="search-card">
    <div class="search-row">
      <input type="text" id="codeInput" placeholder="Ex: DVL-CERT-000123"/>
      <button class="search-btn" onclick="verifyCode()"><i class="fa-solid fa-magnifying-glass"></i></button>
    </div>
  </div>

  <div class="result-card" id="resultCard">
    <div class="result-hdr" id="resultHdr">
      <i class="fa-solid fa-circle-check" id="resultIcon"></i>
      <h3 id="resultTitle">Certificado Válido</h3>
    </div>
    <div class="result-body" id="resultBody"></div>
  </div>

  <p class="privacy-note">Esta página confirma apenas a autenticidade do certificado. Notas, contactos e outros dados pessoais não são apresentados publicamente.</p>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";
import { getFirestore, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore.js";

const firebaseConfig = { apiKey:"AIzaSyAl9A_gXDKTB3N6U1f_Bh5FWrOsySjCJGo", authDomain:"dovelingua-site.firebaseapp.com", projectId:"dovelingua-site", storageBucket:"dovelingua-site.firebasestorage.app", messagingSenderId:"271742052334", appId:"1:271742052334:web:bc736373d7ea50001b50ff", measurementId:"G-N8ELT8SMYM" };
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

window.verifyCode = async function() {
  const code = document.getElementById('codeInput').value.trim().toUpperCase();
  if (!code) return;
  try {
    const q = query(collection(db,'certificates'), where('verificationCode','==',code));
    const snap = await getDocs(q);
    document.getElementById('resultCard').style.display = 'block';
    if (snap.empty) {
      document.getElementById('resultHdr').className = 'result-hdr invalid';
      document.getElementById('resultIcon').className = 'fa-solid fa-circle-xmark';
      document.getElementById('resultTitle').textContent = 'Código Não Encontrado';
      document.getElementById('resultBody').innerHTML = '<p style="font-size:13px;color:var(--mid);text-align:center;">Este código não corresponde a nenhum certificado emitido pela DoveLingua.</p>';
      return;
    }
    const cert = snap.docs[0].data();
    document.getElementById('resultHdr').className = 'result-hdr valid';
    document.getElementById('resultIcon').className = 'fa-solid fa-circle-check';
    document.getElementById('resultTitle').textContent = 'Certificado Válido';
    document.getElementById('resultBody').innerHTML = `
      <div class="dr"><span class="dk">Nome</span><span class="dv">${cert.studentName||'-'}</span></div>
      <div class="dr"><span class="dk">Curso Concluído</span><span class="dv">${cert.courseCompleted||'-'}</span></div>
      <div class="dr"><span class="dk">Data de Emissão</span><span class="dv">${cert.dateIssued ? new Date(cert.dateIssued.seconds*1000).toLocaleDateString('pt-PT') : '-'}</span></div>
      <div class="dr"><span class="dk">Instituição</span><span class="dv">DoveLingua English Learning Academy</span></div>`;
  } catch(e) { console.error(e); }
};
const params = new URLSearchParams(window.location.search);
if (params.get('code')) { document.getElementById('codeInput').value = params.get('code'); verifyCode(); }
</script>
</body>
</html>
