<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Materiais - DoveLingua</title>
<link rel="icon" type="image/png" sizes="32x32" href="https://download.dovelingua.com/website/Favicon_32x32.png">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root{--navy:#0B2E73;--navy-d:#082154;--gold:#C9971A;--white:#FFFFFF;--grey:#F4F4F4;--tint:#E8EEF9;--text:#1a2332;--mid:#4a5568;--light:#718096;--border:#e2e8f0;--r:14px;--shadow:0 4px 20px rgba(11,46,115,.08);}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Inter',Arial,sans-serif;color:var(--text);background:var(--grey);line-height:1.6;}
a{text-decoration:none;color:inherit;}
button,input,select{font-family:inherit;}
.s-nav{position:sticky;top:0;z-index:999;background:var(--white);border-bottom:1px solid var(--border);padding:0 4%;height:64px;display:flex;align-items:center;justify-content:space-between;}
.s-nav-brand img{height:38px;}
.s-back{display:flex;align-items:center;gap:6px;background:var(--tint);border:1px solid var(--border);border-radius:20px;padding:8px 14px;font-size:12px;font-weight:600;color:var(--navy);cursor:pointer;}
.s-hero{background:linear-gradient(135deg,var(--navy-d),var(--navy));padding:18px 4%;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;}
.s-hero h1{font-family:'Playfair Display',serif;font-size:clamp(17px,2.4vw,21px);color:#fff;display:flex;align-items:center;gap:8px;}
.s-hero h1 i{color:var(--gold);}
.btn{display:inline-flex;align-items:center;gap:8px;padding:9px 18px;border-radius:20px;font-size:12.5px;font-weight:600;border:none;cursor:pointer;}
.btn-gold{background:var(--gold);color:var(--navy);}
.s-wrap{max-width:880px;margin:0 auto;padding:20px 4% 50px;}
.mat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;}
.mat-card{background:var(--white);border-radius:var(--r);border:1px solid var(--border);box-shadow:var(--shadow);padding:16px;}
.mat-title{font-size:13.5px;font-weight:700;color:var(--navy);margin-bottom:4px;}
.mat-level{font-size:10.5px;color:var(--light);margin-bottom:10px;}
.mat-link{font-size:12px;color:var(--navy);font-weight:600;display:flex;align-items:center;gap:6px;}
.modal-ov{display:none;position:fixed;inset:0;background:rgba(11,46,115,.5);z-index:500;align-items:center;justify-content:center;padding:16px;}
.modal-ov.show{display:flex;}
.modal{background:var(--white);border-radius:var(--r);max-width:420px;width:100%;}
.modal-hdr{padding:18px 22px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;}
.modal-hdr h3{font-family:'Playfair Display',serif;font-size:16px;color:var(--navy);}
.modal-close{width:28px;height:28px;border-radius:8px;background:var(--grey);border:none;cursor:pointer;}
.modal-body{padding:18px 22px;display:flex;flex-direction:column;gap:12px;}
.modal-body label{font-size:11px;font-weight:700;color:var(--mid);text-transform:uppercase;margin-bottom:4px;display:block;}
.modal-body input,.modal-body select{width:100%;padding:10px 14px;border:1.5px solid var(--border);border-radius:10px;font-size:13px;outline:none;}
.modal-ftr{padding:14px 22px 18px;display:flex;justify-content:flex-end;gap:10px;}
.btn-o{background:transparent;color:var(--navy);border:1.5px solid var(--navy);}
.btn-g{background:var(--navy);color:#fff;}
</style>
</head>
<body>
<nav class="s-nav">
  <a href="index.html" class="s-nav-brand"><img src="https://download.dovelingua.com/website/Master_Wordmar_original.png" alt="DoveLingua"></a>
  <button class="s-back" onclick="location.href='teacher-dashboard.html'"><i class="fa-solid fa-arrow-left"></i> Painel</button>
</nav>
<div class="s-hero">
  <h1><i class="fa-solid fa-book"></i> Materiais</h1>
  <button class="btn btn-gold" onclick="document.getElementById('addModal').classList.add('show')"><i class="fa-solid fa-plus"></i> Adicionar</button>
</div>
<div class="s-wrap">
  <div class="mat-grid" id="matGrid"></div>
</div>

<div class="modal-ov" id="addModal">
  <div class="modal">
    <div class="modal-hdr"><h3>Novo Material</h3><button class="modal-close" onclick="document.getElementById('addModal').classList.remove('show')">✕</button></div>
    <div class="modal-body">
      <div><label>Título</label><input type="text" id="fTitle" placeholder="Ex: Ficha Unidade 3"/></div>
      <div><label>Link</label><input type="text" id="fLink" placeholder="https://drive.google.com/..."/></div>
      <div><label>Nível</label><select id="fLevel"><option>A1</option><option>A2</option><option>A2+</option><option>B1</option></select></div>
    </div>
    <div class="modal-ftr"><button class="btn btn-o" onclick="document.getElementById('addModal').classList.remove('show')">Cancelar</button><button class="btn btn-g" onclick="saveMat()">Guardar</button></div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-auth.js";
import { getFirestore, doc, getDoc, collection, addDoc, getDocs, where, query, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore.js";

const firebaseConfig = { apiKey:"AIzaSyAl9A_gXDKTB3N6U1f_Bh5FWrOsySjCJGo", authDomain:"dovelingua-site.firebaseapp.com", projectId:"dovelingua-site", storageBucket:"dovelingua-site.firebasestorage.app", messagingSenderId:"271742052334", appId:"1:271742052334:web:bc736373d7ea50001b50ff", measurementId:"G-N8ELT8SMYM" };
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
let teacherId = null;

onAuthStateChanged(auth, async (user) => {
  if (!user) { window.location.href='auth.html'; return; }
  const snap = await getDoc(doc(db,'users',user.uid));
  if (!snap.exists() || (snap.data().role!=='teacher' && snap.data().role!=='admin')) { window.location.href='unauthorized.html'; return; }
  teacherId = user.uid;
  loadMats();
});

async function loadMats() {
  const q = query(collection(db,'documents'), where('uploadedBy','==',teacherId));
  const snap = await getDocs(q);
  const grid = document.getElementById('matGrid');
  if (snap.empty) { grid.innerHTML = '<p style="color:var(--light);grid-column:1/-1;text-align:center;padding:40px;">Nenhum material adicionado.</p>'; return; }
  grid.innerHTML = snap.docs.map(d => { const m=d.data(); return `<div class="mat-card"><div class="mat-title">${m.title}</div><div class="mat-level">${m.level||''}</div><a href="${m.fileLink}" target="_blank" class="mat-link"><i class="fa-solid fa-download"></i> Abrir</a></div>`; }).join('');
}
window.saveMat = async function() {
  const title = document.getElementById('fTitle').value.trim();
  const fileLink = document.getElementById('fLink').value.trim();
  const level = document.getElementById('fLevel').value;
  if (!title || !fileLink) { alert('Preencha título e link.'); return; }
  await addDoc(collection(db,'documents'), { title, fileLink, level, category:'academic', visibility:'student', uploadedBy:teacherId, uploadedAt:serverTimestamp() });
  document.getElementById('addModal').classList.remove('show');
  loadMats();
};
</script>
<script src="/key-lock.js"></script>
</body>
</html>
