<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Estado do Pagamento - DoveLingua</title>
<link rel="icon" type="image/png" sizes="32x32" href="https://download.dovelingua.com/website/Favicon_32x32.png">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{
  --navy:#0B2E73;--navy-d:#082154;--gold:#C9971A;--white:#FFFFFF;
  --grey:#F4F4F4;--tint:#E8EEF9;--teal:#0E8F7F;
  --text:#1a2332;--mid:#4a5568;--light:#718096;--border:#e2e8f0;
  --r:16px;--shadow:0 4px 20px rgba(11,46,115,.08);
  --amber:#b45309;--amber-bg:#fef3e2;--green:#0E8F7F;--green-bg:#e6f6f4;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Inter',Arial,sans-serif;color:var(--text);background:var(--grey);line-height:1.7;}
a{text-decoration:none;color:inherit;}
button,input{font-family:inherit;}

nav{position:sticky;top:0;z-index:999;background:var(--white);border-bottom:1px solid var(--border);padding:0 clamp(1rem,4vw,2.5rem);height:74px;display:flex;align-items:center;justify-content:space-between;}
.nav-brand img{height:48px;}
.back-link{font-size:.82rem;color:var(--light);display:flex;align-items:center;gap:6px;cursor:pointer;}

.hero{background:linear-gradient(150deg,var(--navy-d),var(--navy) 55%,#123a8a);padding:44px 5% 36px;text-align:center;}
.hero h1{font-family:'Playfair Display',serif;font-size:clamp(20px,3vw,28px);color:#fff;margin-bottom:8px;}

.wrap{max-width:640px;margin:0 auto;padding:28px 5% 60px;}
.search-card{background:var(--white);border-radius:var(--r);border:1px solid var(--border);box-shadow:var(--shadow);padding:26px 24px;margin-bottom:20px;}
.search-card h2{font-size:15px;color:var(--navy);margin-bottom:8px;}
.search-card p{font-size:12.5px;color:var(--light);margin-bottom:18px;line-height:1.7;}
.search-row{display:flex;gap:10px;}
.search-row input{flex:1;padding:12px 16px;border:1.5px solid var(--border);border-radius:10px;font-size:14px;outline:none;letter-spacing:.5px;}
.search-row input:focus{border-color:var(--navy);}
.search-btn{background:var(--navy);color:#fff;border:none;border-radius:10px;padding:12px 22px;font-size:13px;font-weight:700;cursor:pointer;}
.search-btn:hover{background:var(--gold);color:var(--navy);}

.result-card{display:none;background:var(--white);border-radius:var(--r);border:1px solid var(--border);box-shadow:var(--shadow);overflow:hidden;margin-bottom:20px;}
.rc-hdr{background:var(--navy);padding:18px 24px;}
.rc-hdr h3{font-family:'Playfair Display',serif;font-size:16px;color:var(--gold);}
.rc-body{padding:22px 24px;}
.status-badge{display:inline-flex;align-items:center;gap:8px;padding:8px 18px;border-radius:20px;font-size:13px;font-weight:700;margin-bottom:18px;}
.status-badge.pending{background:var(--amber-bg);color:var(--amber);}
.status-badge.paid{background:var(--green-bg);color:var(--green);}
.dr{display:flex;justify-content:space-between;font-size:12.5px;padding:7px 0;border-bottom:1px solid var(--grey);}
.dk{font-weight:700;color:var(--navy);}
.dv{color:var(--mid);text-align:right;}
.pending-info{background:var(--amber-bg);border-left:4px solid var(--amber);border-radius:10px;padding:16px 18px;margin-top:16px;font-size:12.5px;color:var(--amber);line-height:1.7;}
.paid-info{background:var(--green-bg);border-left:4px solid var(--green);border-radius:10px;padding:16px 18px;margin-top:16px;font-size:12.5px;color:var(--green);line-height:1.7;}
.action-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px;}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:11px;border-radius:10px;font-size:12.5px;font-weight:700;border:none;cursor:pointer;}
.btn-g{background:var(--navy);color:#fff;}
.btn-teal{background:var(--teal);color:#fff;}

.spin-ov{position:fixed;inset:0;background:rgba(11,46,115,.6);z-index:9000;display:none;align-items:center;justify-content:center;}
.spin-ov.on{display:flex;}
.spin{width:44px;height:44px;border:4px solid rgba(255,255,255,.2);border-top-color:#fff;border-radius:50%;animation:sp .9s linear infinite;}
@keyframes sp{to{transform:rotate(360deg);}}
</style>
</head>
<body>

<div class="spin-ov" id="spinOv"><div class="spin"></div></div>

<nav>
  <a href="index.html" class="nav-brand"><img src="https://download.dovelingua.com/website/Master_Wordmar_original.png" alt="DoveLingua"></a>
  <a class="back-link" onclick="location.href='index.html'"><i class="fa-solid fa-house"></i> Início</a>
</nav>

<div class="hero"><h1><i class="fa-solid fa-magnifying-glass" style="color:var(--gold);margin-right:8px;"></i>Estado do Pagamento</h1></div>

<div class="wrap">
  <div class="search-card">
    <h2>Consultar Código de Referência</h2>
    <p>Introduza o código que recebeu ao concluir a sua inscrição.</p>
    <div class="search-row">
      <input type="text" id="refInput" placeholder="Ex: DVL-202612345"/>
      <button class="search-btn" onclick="checkStatus()"><i class="fa-solid fa-magnifying-glass"></i> Verificar</button>
    </div>
  </div>

  <div class="result-card" id="resultCard">
    <div class="rc-hdr"><h3 id="rcTitle">Resultado</h3></div>
    <div class="rc-body">
      <div id="statusBadgeWrap"></div>
      <div id="dataRows"></div>
      <div id="statusExtra"></div>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";
import { getFirestore, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAl9A_gXDKTB3N6U1f_Bh5FWrOsySjCJGo",
  authDomain: "dovelingua-site.firebaseapp.com",
  projectId: "dovelingua-site",
  storageBucket: "dovelingua-site.firebasestorage.app",
  messagingSenderId: "271742052334",
  appId: "1:271742052334:web:bc736373d7ea50001b50ff",
  measurementId: "G-N8ELT8SMYM"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

window.checkStatus = async function() {
  const code = document.getElementById('refInput').value.trim().toUpperCase();
  if (!code) { alert('Introduza o código de referência.'); return; }
  document.getElementById('spinOv').classList.add('on');
  try {
    const q = query(collection(db, 'applications'), where('refCode', '==', code));
    const snap = await getDocs(q);
    document.getElementById('spinOv').classList.remove('on');
    if (snap.empty) { alert('Código não encontrado. Verifique e tente novamente.'); return; }
    const rec = snap.docs[0].data();
    showResult(rec);
  } catch (e) {
    document.getElementById('spinOv').classList.remove('on');
    alert('Erro ao verificar. Tente novamente.');
  }
};

function showResult(rec) {
  document.getElementById('resultCard').style.display = 'block';
  const isPaid = rec.applicationStatus === 'confirmed' || rec.applicationStatus === 'enrolled';
  document.getElementById('rcTitle').textContent = isPaid ? 'Pagamento Confirmado' : 'A Aguardar Confirmação';
  document.getElementById('statusBadgeWrap').innerHTML = isPaid
    ? '<span class="status-badge paid"><i class="fa-solid fa-circle-check"></i> PAGO — Confirmado</span>'
    : '<span class="status-badge pending"><i class="fa-solid fa-hourglass-half"></i> PENDENTE</span>';

  document.getElementById('dataRows').innerHTML = `
    <div class="dr"><span class="dk">Nome</span><span class="dv">${rec.fullName||'-'}</span></div>
    <div class="dr"><span class="dk">Nível</span><span class="dv">${rec.levelName||'-'}</span></div>
    <div class="dr"><span class="dk">Modalidade</span><span class="dv">${rec.modality==='monthly'?'Mensal':'Nível Completo'}</span></div>
    <div class="dr"><span class="dk">Total</span><span class="dv">${rec.total||0} MZN</span></div>
  `;

  document.getElementById('statusExtra').innerHTML = isPaid
    ? `<div class="paid-info"><i class="fa-solid fa-circle-check"></i> A sua conta foi ativada como Aluno. Use o botão "Esqueci a palavra-passe" na página de Entrar para definir o seu acesso.</div>
       <div class="action-grid"><a href="auth.html" class="btn btn-g"><i class="fa-solid fa-right-to-bracket"></i> Entrar</a><a href="https://classroom.dovelingua.com" target="_blank" class="btn btn-teal"><i class="fa-solid fa-display"></i> Classroom</a></div>`
    : `<div class="pending-info"><i class="fa-solid fa-circle-info"></i> O pagamento é confirmado em até 12 horas. Guarde este código e volte a verificar mais tarde.</div>
       <div class="action-grid"><a href="https://wa.me/258828920143" target="_blank" class="btn btn-g"><i class="fa-brands fa-whatsapp"></i> Suporte</a><a href="contact.html" class="btn btn-teal"><i class="fa-solid fa-envelope"></i> Contacto</a></div>`;
}

const params = new URLSearchParams(window.location.search);
if (params.get('ref')) { document.getElementById('refInput').value = params.get('ref'); checkStatus(); }
</script>
<script src="/key-lock.js"></script>
</body>
</html>
