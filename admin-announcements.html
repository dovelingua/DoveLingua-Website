<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Avisos - Admin DoveLingua</title>
<link rel="icon" type="image/png" sizes="32x32" href="https://download.dovelingua.com/website/Favicon_32x32.png">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root{
  --navy:#0B2E73;--navy-d:#082154;--gold:#C9971A;--white:#FFFFFF;
  --grey:#F4F4F4;--tint:#E8EEF9;--teal:#0E8F7F;
  --text:#1a2332;--mid:#4a5568;--light:#718096;--border:#e2e8f0;
  --r:14px;--shadow:0 4px 20px rgba(11,46,115,.08);
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Inter',Arial,sans-serif;color:var(--text);background:var(--grey);line-height:1.6;}
a{text-decoration:none;color:inherit;}
button,input,select,textarea{font-family:inherit;}

.app{display:flex;min-height:100vh;}
.sidebar{width:250px;background:var(--navy);flex-shrink:0;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;}
.sb-logo{padding:20px 18px;border-bottom:1px solid rgba(255,255,255,.1);}
.sb-logo img{height:38px;}
.sb-nav{flex:1;padding:14px 0;overflow-y:auto;}
.sb-nav a{display:flex;align-items:center;gap:12px;padding:12px 18px;font-size:13px;color:rgba(255,255,255,.65);cursor:pointer;border-left:3px solid transparent;transition:.15s;}
.sb-nav a:hover{background:rgba(255,255,255,.05);color:#fff;}
.sb-nav a.active{background:rgba(255,255,255,.08);color:var(--gold);border-left-color:var(--gold);}
.sb-nav a i{width:18px;text-align:center;}
.sb-section-label{padding:16px 18px 6px;font-size:10px;font-weight:700;color:rgba(255,255,255,.3);text-transform:uppercase;letter-spacing:1px;}
.sb-foot{padding:16px 18px;border-top:1px solid rgba(255,255,255,.1);}
.sb-foot .admin-name{font-size:12.5px;color:#fff;font-weight:600;}
.sb-foot .admin-role{font-size:10.5px;color:rgba(255,255,255,.4);}
.sb-foot a{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:12px;color:rgba(255,255,255,.5);cursor:pointer;}

.main{flex:1;min-width:0;}
.topbar{background:var(--white);border-bottom:1px solid var(--border);padding:16px 28px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;position:sticky;top:0;z-index:40;}
.topbar h1{font-family:'Playfair Display',serif;font-size:19px;color:var(--navy);}
.topbar .tb-sub{font-size:12px;color:var(--light);}
.hamburger-mobile{display:none;background:none;border:none;font-size:20px;color:var(--navy);cursor:pointer;}
.content{padding:24px 28px 60px;}

.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 20px;border-radius:20px;font-size:13px;font-weight:600;border:none;cursor:pointer;}
.btn-g{background:var(--navy);color:#fff;}
.btn-g:hover{background:var(--gold);color:var(--navy);}
.btn-o{background:transparent;color:var(--navy);border:1.5px solid var(--navy);}

.ann-list{display:flex;flex-direction:column;gap:12px;}
.ann-card{background:var(--white);border-radius:var(--r);border:1px solid var(--border);box-shadow:var(--shadow);padding:18px 20px;}
.ann-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;}
.ann-title{font-size:14.5px;font-weight:700;color:var(--navy);}
.ann-audience{font-size:10px;font-weight:700;padding:3px 10px;border-radius:10px;background:var(--tint);color:var(--navy);}
.ann-body-text{font-size:12.5px;color:var(--mid);line-height:1.65;margin-bottom:10px;}
.ann-meta{font-size:11px;color:var(--light);display:flex;justify-content:space-between;}
.ann-actions{display:flex;gap:6px;}
.icon-btn{width:28px;height:28px;border-radius:7px;background:var(--grey);border:none;color:var(--mid);cursor:pointer;}
.icon-btn:hover{background:var(--navy);color:#fff;}
.icon-btn.del:hover{background:#c0392b;}

.modal-ov{display:none;position:fixed;inset:0;background:rgba(11,46,115,.5);z-index:500;align-items:center;justify-content:center;padding:16px;}
.modal-ov.show{display:flex;}
.modal{background:var(--white);border-radius:var(--r);max-width:520px;width:100%;}
.modal-hdr{padding:20px 24px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;}
.modal-hdr h3{font-family:'Playfair Display',serif;font-size:16px;color:var(--navy);}
.modal-close{width:30px;height:30px;border-radius:8px;background:var(--grey);border:none;cursor:pointer;}
.modal-body{padding:20px 24px;display:flex;flex-direction:column;gap:14px;}
.modal-body label{font-size:11px;font-weight:700;color:var(--mid);text-transform:uppercase;margin-bottom:6px;display:block;}
.modal-body input,.modal-body select,.modal-body textarea{width:100%;padding:10px 14px;border:1.5px solid var(--border);border-radius:10px;font-size:13.5px;outline:none;}
.modal-body textarea{min-height:100px;resize:vertical;}
.modal-ftr{padding:16px 24px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px;}
.toast{position:fixed;bottom:24px;right:24px;background:var(--navy);color:#fff;padding:14px 22px;border-radius:12px;font-size:13px;z-index:600;transform:translateY(100px);opacity:0;transition:.3s;}
.toast.show{transform:translateY(0);opacity:1;}
@media(max-width:800px){.sidebar{position:fixed;left:-260px;z-index:200;transition:left .25s;}.sidebar.open{left:0;}.hamburger-mobile{display:block;}}
</style>
</head>
<body>

<div class="app">
  <div class="sidebar" id="sidebar">
    <div class="sb-logo"><img src="https://download.dovelingua.com/website/Master_Wordmark_white_tex_navy_background.png" alt="DoveLingua"></div>
    <div class="sb-nav">
      <div class="sb-section-label">Gestão</div>
      <a onclick="location.href='admin-dashboard.html'"><i class="fa-solid fa-gauge"></i> Painel Geral</a>
      <a onclick="location.href='admin-users.html'"><i class="fa-solid fa-users"></i> Utilizadores</a>
      <a onclick="location.href='admin-courses.html'"><i class="fa-solid fa-graduation-cap"></i> Cursos</a>
      <div class="sb-section-label">Avaliação</div>
      <a onclick="location.href='admin-level-test-editor.html'"><i class="fa-solid fa-clipboard-question"></i> Editor de Testes</a>
      <a class="active"><i class="fa-solid fa-bullhorn"></i> Avisos</a>
      <a onclick="location.href='admin-documents.html'"><i class="fa-solid fa-folder"></i> Documentos</a>
    </div>
    <div class="sb-foot"><div class="admin-name" id="adminName">Admin</div><div class="admin-role">Administrador</div><a id="logoutBtn"><i class="fa-solid fa-right-from-bracket"></i> Sair</a></div>
  </div>

  <div class="main">
    <div class="topbar">
      <div style="display:flex;align-items:center;gap:12px;">
        <button class="hamburger-mobile" onclick="document.getElementById('sidebar').classList.toggle('open')"><i class="fa-solid fa-bars"></i></button>
        <div><h1>Avisos</h1><div class="tb-sub">Publicar notícias e comunicados</div></div>
      </div>
      <button class="btn btn-g" onclick="openModal()"><i class="fa-solid fa-plus"></i> Novo Aviso</button>
    </div>
    <div class="content">
      <div class="ann-list" id="annList"></div>
    </div>
  </div>
</div>

<div class="modal-ov" id="annModal">
  <div class="modal">
    <div class="modal-hdr"><h3>Novo Aviso</h3><button class="modal-close" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button></div>
    <div class="modal-body">
      <div><label>Título</label><input type="text" id="fTitle" placeholder="Título do aviso"/></div>
      <div><label>Mensagem</label><textarea id="fBody" placeholder="Conteúdo do aviso..."></textarea></div>
      <div><label>Audiência</label><select id="fAudience"><option value="public">Público</option><option value="student">Alunos</option><option value="teacher">Professores</option><option value="all">Todos</option></select></div>
    </div>
    <div class="modal-ftr"><button class="btn btn-o" onclick="closeModal()">Cancelar</button><button class="btn btn-g" onclick="publish()"><i class="fa-solid fa-paper-plane"></i> Publicar</button></div>
  </div>
</div>
<div class="toast" id="toast"><span id="toastText"></span></div>

<script type="module">
// ============================================
// IMPORT FROM SINGLE SOURCE OF TRUTH
// ============================================
import { 
  db,
  authStateListener,
  signOutUser,
  getUserData,
  getRoles,
  collection,
  addDoc,
  deleteDoc,
  doc,
  getDocs,
  query,
  orderBy,
  serverTimestamp
} from "./firebase-shared.js";

// ============================================
// UI FUNCTIONS
// ============================================
const audLabels = { 
  public: 'Público', 
  student: 'Alunos', 
  teacher: 'Professores', 
  all: 'Todos' 
};

function showToast(t) { 
  const el = document.getElementById('toast'); 
  el.classList.add('show'); 
  document.getElementById('toastText').textContent = t; 
  setTimeout(() => el.classList.remove('show'), 3000); 
}

// ============================================
// LOAD ANNOUNCEMENTS
// ============================================
async function loadAnnouncements() {
  try {
    const q = query(collection(db, 'announcements'), orderBy('postedAt', 'desc'));
    const snap = await getDocs(q);
    const list = document.getElementById('annList');
    
    if (snap.empty) { 
      list.innerHTML = '<p style="color:var(--light);text-align:center;padding:40px;">Nenhum aviso publicado ainda.</p>'; 
      return; 
    }
    
    list.innerHTML = snap.docs.map(d => {
      const a = d.data();
      const postedDate = a.postedAt ? new Date(a.postedAt.seconds * 1000).toLocaleDateString('pt-PT') : '';
      return `
        <div class="ann-card">
          <div class="ann-top">
            <span class="ann-title">${a.title}</span>
            <span class="ann-audience">${audLabels[a.audience] || a.audience}</span>
          </div>
          <div class="ann-body-text">${a.body}</div>
          <div class="ann-meta">
            <span>${postedDate}</span>
            <div class="ann-actions">
              <button class="icon-btn del" onclick="deleteAnn('${d.id}')"><i class="fa-solid fa-trash"></i></button>
            </div>
          </div>
        </div>
      `;
    }).join('');
  } catch (e) {
    console.error('Error loading announcements:', e);
    showToast('Erro ao carregar avisos.');
  }
}

// ============================================
// MODAL FUNCTIONS
// ============================================
window.openModal = function() { 
  document.getElementById('annModal').classList.add('show'); 
};

window.closeModal = function() { 
  document.getElementById('annModal').classList.remove('show'); 
  // Clear form fields
  document.getElementById('fTitle').value = '';
  document.getElementById('fBody').value = '';
  document.getElementById('fAudience').value = 'public';
};

// ============================================
// PUBLISH ANNOUNCEMENT
// ============================================
window.publish = async function() {
  const title = document.getElementById('fTitle').value.trim();
  const body = document.getElementById('fBody').value.trim();
  const audience = document.getElementById('fAudience').value;
  
  if (!title || !body) { 
    showToast('Preencha o título e a mensagem.'); 
    return; 
  }
  
  try {
    await addDoc(collection(db, 'announcements'), { 
      title, 
      body, 
      audience, 
      postedAt: serverTimestamp() 
    });
    showToast('Aviso publicado com sucesso.'); 
    closeModal(); 
    loadAnnouncements();
  } catch(e) { 
    console.error('Error publishing:', e);
    showToast('Erro ao publicar aviso.'); 
  }
};

// ============================================
// DELETE ANNOUNCEMENT
// ============================================
window.deleteAnn = async function(id) {
  if (!confirm('Eliminar este aviso?')) return;
  try {
    await deleteDoc(doc(db, 'announcements', id));
    showToast('Aviso eliminado.'); 
    loadAnnouncements();
  } catch(e) {
    console.error('Error deleting:', e);
    showToast('Erro ao eliminar aviso.');
  }
};

// ============================================
// AUTH STATE LISTENER
// ============================================
authStateListener(async (user) => {
  if (!user) { 
    window.location.href = 'auth.html'; 
    return; 
  }
  
  try {
    const userData = await getUserData(user);
    
    if (!userData) {
      window.location.href = 'auth.html';
      return;
    }
    
    // Check if user is blocked
    if (userData.isBlocked) {
      await signOutUser();
      window.location.href = 'auth.html?blocked=1';
      return;
    }
    
    // Check if user has admin role
    const roles = getRoles(userData);
    if (!roles.includes('admin')) {
      window.location.href = 'unauthorized.html';
      return;
    }
    
    // Display admin name
    document.getElementById('adminName').textContent = userData.fullName || 'Admin';
    
    // Load announcements
    loadAnnouncements();
    
  } catch (e) {
    console.error('Auth check failed:', e);
    window.location.href = 'auth.html';
  }
});

// ============================================
// LOGOUT
// ============================================
document.getElementById('logoutBtn').addEventListener('click', async () => { 
  await signOutUser(); 
  window.location.href = 'index.html'; 
});
</script>
<script src="/key-lock.js"></script>
</body>
</html>
