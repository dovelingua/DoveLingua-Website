<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Acesso Não Autorizado - DoveLingua</title>
<link rel="icon" type="image/png" sizes="32x32" href="https://download.dovelingua.com/website/Favicon_32x32.png">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root{--navy:#0B2E73;--navy-d:#082154;--gold:#C9971A;--white:#FFFFFF;--grey:#F4F4F4;--mid:#4a5568;--border:#e2e8f0;--r:16px;--shadow:0 4px 20px rgba(11,46,115,.08);}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Inter',Arial,sans-serif;background:var(--grey);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
a{text-decoration:none;color:inherit;}
.card{background:var(--white);border-radius:var(--r);border:1px solid var(--border);box-shadow:var(--shadow);padding:44px 32px;text-align:center;max-width:400px;}
.card i{font-size:52px;color:var(--gold);margin-bottom:18px;}
.card h1{font-family:'Playfair Display',serif;font-size:20px;color:var(--navy);margin-bottom:10px;}
.card p{font-size:13px;color:var(--mid);line-height:1.7;margin-bottom:24px;}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--navy);color:#fff;padding:12px 24px;border-radius:30px;font-size:13px;font-weight:700;}
.btn:hover{background:var(--gold);color:var(--navy);}
</style>
</head>
<body>
<div class="card">
  <i class="fa-solid fa-lock"></i>
  <h1>Acesso Não Autorizado</h1>
  <p>Não tem permissão para aceder a esta página com a sua conta actual. Se pensa que isto é um erro, contacte o suporte.</p>
  <a href="index.html" class="btn"><i class="fa-solid fa-house"></i> Voltar à Página Inicial</a>
</div>
</body>
</html>
