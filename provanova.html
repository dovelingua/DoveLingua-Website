<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ProvaNova — Splash Preview</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0a0a0a;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Inter', sans-serif;
    }

    .phone-frame {
      width: 375px;
      height: 812px;
      border-radius: 48px;
      overflow: hidden;
      position: relative;
      box-shadow:
        0 0 0 8px #1a1a1a,
        0 0 0 10px #2a2a2a,
        0 50px 100px rgba(0,0,0,0.9);
    }

    /* ── SPLASH ROOT ── */
    #pwa-splash {
      position: absolute;
      inset: 0;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      overflow: hidden;
      padding: 0 24px 32px;
    }

    /* subtle top blue bar */
    .splash-top-bar {
      width: 100%;
      height: 4px;
      background: linear-gradient(90deg, #0057FF, #5B9BFF);
      position: absolute;
      top: 0;
      left: 0;
    }

    /* ── LOGO SECTION ── */
    .logo-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 64px;
      margin-bottom: 36px;
      opacity: 0;
      transform: translateY(-12px);
    }

    .logo-section.appear {
      animation: dropIn 0.55s cubic-bezier(0.34, 1.4, 0.64, 1) forwards;
    }

    .logo-mark {
      width: 68px;
      height: 68px;
      background: linear-gradient(135deg, #0044CC 0%, #0057FF 100%);
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 14px;
      box-shadow:
        0 8px 24px rgba(0, 87, 255, 0.3),
        0 2px 8px rgba(0, 87, 255, 0.15);
    }

    .logo-mark i {
      font-size: 28px;
      color: #ffffff;
    }

    .logo-name {
      font-size: 26px;
      font-weight: 900;
      color: #212121;
      letter-spacing: -0.8px;
      margin-bottom: 4px;
    }

    .logo-name span {
      color: #0057FF;
    }

    .logo-tagline {
      font-size: 11px;
      font-weight: 500;
      color: #9AA3B5;
      letter-spacing: 0.02em;
      text-align: center;
    }

    /* ── INTRO LABEL ── */
    .intro-label {
      font-size: 10px;
      font-weight: 700;
      color: #0057FF;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      margin-bottom: 14px;
      opacity: 0;
    }

    .intro-label.appear {
      animation: fadeUp 0.4s ease forwards;
    }

    /* ── GRID ── */
    .cards-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      width: 100%;
    }

    /* ── INDIVIDUAL CARD ── */
    .feat-card {
      background: #ffffff;
      border: 1.5px solid #F0F2F8;
      border-radius: 18px;
      padding: 18px 14px 16px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 10px;
      opacity: 0;
      transform: translateY(20px) scale(0.96);
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.05);
      position: relative;
      overflow: hidden;
    }

    .feat-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      border-radius: 18px 18px 0 0;
    }

    .feat-card.pop {
      animation: cardPop 0.45s cubic-bezier(0.34, 1.4, 0.64, 1) forwards;
    }

    /* card accent colours */
    .feat-card.blue  .card-icon-wrap { background: rgba(0, 87, 255, 0.08); }
    .feat-card.blue  .card-icon-wrap i { color: #0057FF; }
    .feat-card.blue::before { background: linear-gradient(90deg, #0057FF, #5B9BFF); }

    .feat-card.teal  .card-icon-wrap { background: rgba(0, 105, 92, 0.08); }
    .feat-card.teal  .card-icon-wrap i { color: #00695C; }
    .feat-card.teal::before { background: linear-gradient(90deg, #00695C, #00897B); }

    .feat-card.gold  .card-icon-wrap { background: rgba(255, 179, 0, 0.1); }
    .feat-card.gold  .card-icon-wrap i { color: #E65100; }
    .feat-card.gold::before { background: linear-gradient(90deg, #FFB300, #FFD54F); }

    .feat-card.indigo .card-icon-wrap { background: rgba(63, 81, 181, 0.08); }
    .feat-card.indigo .card-icon-wrap i { color: #3F51B5; }
    .feat-card.indigo::before { background: linear-gradient(90deg, #3F51B5, #7986CB); }

    .feat-card.rose  .card-icon-wrap { background: rgba(194, 24, 91, 0.07); }
    .feat-card.rose  .card-icon-wrap i { color: #C2185B; }
    .feat-card.rose::before { background: linear-gradient(90deg, #C2185B, #E91E8C); }

    .feat-card.slate .card-icon-wrap { background: rgba(38, 50, 56, 0.07); }
    .feat-card.slate .card-icon-wrap i { color: #37474F; }
    .feat-card.slate::before { background: linear-gradient(90deg, #37474F, #607D8B); }

    .card-icon-wrap {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card-icon-wrap i {
      font-size: 17px;
    }

    .card-body { width: 100%; }

    .card-title {
      font-size: 12px;
      font-weight: 800;
      color: #212121;
      line-height: 1.3;
      margin-bottom: 2px;
    }

    .card-sub {
      font-size: 10px;
      font-weight: 400;
      color: #9AA3B5;
      line-height: 1.4;
    }

    /* ── BOTTOM ── */
    .splash-bottom {
      margin-top: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      opacity: 0;
      width: 100%;
    }

    .splash-bottom.appear {
      animation: fadeUp 0.4s ease forwards;
    }

    .progress-track {
      width: 100%;
      height: 2px;
      background: #F0F2F8;
      border-radius: 99px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #0057FF, #5B9BFF);
      border-radius: 99px;
      transition: width 0.35s ease;
    }

    .splash-ready-text {
      font-size: 11px;
      font-weight: 600;
      color: #C5CAD5;
      letter-spacing: 0.03em;
    }

    /* ── KEYFRAMES ── */
    @keyframes dropIn {
      from { opacity: 0; transform: translateY(-12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes cardPop {
      from { opacity: 0; transform: translateY(20px) scale(0.96); }
      to   { opacity: 1; transform: translateY(0)   scale(1); }
    }

    /* ── REPLAY BTN (preview only) ── */
    .replay-btn {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255,255,255,0.1);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.2);
      padding: 10px 28px;
      border-radius: 50px;
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      backdrop-filter: blur(12px);
      transition: background 0.2s;
      z-index: 999;
      white-space: nowrap;
    }
    .replay-btn:hover { background: rgba(255,255,255,0.18); }
  </style>
</head>
<body>

  <div class="phone-frame">
    <div id="pwa-splash">

      <div class="splash-top-bar"></div>

      <!-- LOGO -->
      <div class="logo-section" id="logo-section">
        <div class="logo-mark">
          <i class="fa-solid fa-file-pen"></i>
        </div>
        <div class="logo-name">Prova<span>Nova</span></div>
        <div class="logo-tagline">Gerador de Avaliações e Exercícios</div>
      </div>

      <!-- LABEL -->
      <div class="intro-label" id="intro-label">O que podes criar</div>

      <!-- GRID -->
      <div class="cards-grid" id="cards-grid">

        <div class="feat-card blue" id="c1">
          <div class="card-icon-wrap">
            <i class="fa-solid fa-pen-to-square"></i>
          </div>
          <div class="card-body">
            <div class="card-title">ACs</div>
            <div class="card-sub">Avaliações Contínuas</div>
          </div>
        </div>

        <div class="feat-card teal" id="c2">
          <div class="card-icon-wrap">
            <i class="fa-solid fa-clipboard-list"></i>
          </div>
          <div class="card-body">
            <div class="card-title">AT</div>
            <div class="card-sub">Avaliação Trimestral</div>
          </div>
        </div>

        <div class="feat-card gold" id="c3">
          <div class="card-icon-wrap">
            <i class="fa-solid fa-umbrella-beach"></i>
          </div>
          <div class="card-body">
            <div class="card-title">Férias</div>
            <div class="card-sub">Trabalho de Férias</div>
          </div>
        </div>

        <div class="feat-card indigo" id="c4">
          <div class="card-icon-wrap">
            <i class="fa-solid fa-people-group"></i>
          </div>
          <div class="card-body">
            <div class="card-title">Grupo</div>
            <div class="card-sub">Trabalho em Grupo</div>
          </div>
        </div>

        <div class="feat-card rose" id="c5">
          <div class="card-icon-wrap">
            <i class="fa-solid fa-rotate-left"></i>
          </div>
          <div class="card-body">
            <div class="card-title">Revisão</div>
            <div class="card-sub">Ficha de Revisão</div>
          </div>
        </div>

        <div class="feat-card slate" id="c6">
          <div class="card-icon-wrap">
            <i class="fa-solid fa-graduation-cap"></i>
          </div>
          <div class="card-body">
            <div class="card-title">Exames</div>
            <div class="card-sub">Prep. para Exame</div>
          </div>
        </div>

      </div>

      <!-- BOTTOM -->
      <div class="splash-bottom" id="splash-bottom">
        <div class="progress-track">
          <div class="progress-fill" id="progress-fill"></div>
        </div>
        <div class="splash-ready-text" id="ready-text">A preparar a sua plataforma…</div>
      </div>

    </div>
  </div>

  <button class="replay-btn" onclick="startSplash()">↺ Replay</button>

  <script>
    const wait = ms => new Promise(r => setTimeout(r, ms));

    function setProgress(pct) {
      document.getElementById('progress-fill').style.width = pct + '%';
    }

    function resetAll() {
      // Logo
      const logo = document.getElementById('logo-section');
      logo.className = 'logo-section';
      logo.style.opacity = '0';

      // Label
      const label = document.getElementById('intro-label');
      label.className = 'intro-label';
      label.style.opacity = '0';

      // Cards
      for (let i = 1; i <= 6; i++) {
        const c = document.getElementById('c' + i);
        c.className = c.className.replace(' pop', '');
        c.style.opacity = '0';
        c.style.transform = 'translateY(20px) scale(0.96)';
      }

      // Bottom
      const bottom = document.getElementById('splash-bottom');
      bottom.className = 'splash-bottom';
      bottom.style.opacity = '0';

      document.getElementById('ready-text').textContent = 'A preparar a sua plataforma…';

      setProgress(0);
    }

    async function startSplash() {
      resetAll();
      await wait(80);

      // ── 1. Logo drops in ──
      const logo = document.getElementById('logo-section');
      logo.style.opacity = '';
      logo.classList.add('appear');
      setProgress(10);
      await wait(620);

      // ── 2. Label appears ──
      const label = document.getElementById('intro-label');
      label.style.opacity = '';
      label.classList.add('appear');
      setProgress(20);
      await wait(300);

      // ── 3. Cards pop in staggered ──
      const delays = [0, 90, 180, 270, 360, 450];
      for (let i = 1; i <= 6; i++) {
        setTimeout(() => {
          const c = document.getElementById('c' + i);
          c.style.opacity = '';
          c.style.transform = '';
          c.classList.add('pop');
          setProgress(20 + i * 12);
        }, delays[i - 1]);
      }

      await wait(900);

      // ── 4. Bottom appears ──
      const bottom = document.getElementById('splash-bottom');
      bottom.style.opacity = '';
      bottom.classList.add('appear');
      setProgress(95);
      await wait(600);

      // ── 5. Done ──
      setProgress(100);
      document.getElementById('ready-text').textContent = 'Pronto. Bem-vindo de volta!';
    }

    startSplash();
  </script>

</body>
</html>
