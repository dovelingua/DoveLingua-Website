<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ProvaNova — Splash Preview</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0a0a0a;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Inter', sans-serif;
    }

    .phone-frame {
      width: 375px;
      height: 812px;
      border-radius: 48px;
      overflow: hidden;
      position: relative;
      box-shadow:
        0 0 0 8px #1a1a1a,
        0 0 0 10px #2a2a2a,
        0 50px 100px rgba(0,0,0,0.9);
    }

    /* ── SPLASH ROOT ── */
    #pwa-splash {
      position: absolute;
      inset: 0;
      background: #0038CC;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* subtle noise texture overlay */
    #pwa-splash::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        radial-gradient(ellipse 80% 60% at 50% -10%, rgba(91,155,255,0.35) 0%, transparent 70%),
        radial-gradient(ellipse 50% 40% at 80% 110%, rgba(0,20,100,0.4) 0%, transparent 70%);
      pointer-events: none;
    }

    /* ── WORD STAGE ── */
    #word-stage {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 2;
    }

    .word-line {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      opacity: 0;
      pointer-events: none;
    }

    .word-main {
      font-size: 52px;
      font-weight: 900;
      color: #ffffff;
      letter-spacing: -2px;
      line-height: 1;
      text-align: center;
    }

    .word-sub {
      font-size: 12px;
      font-weight: 500;
      color: rgba(255,255,255,0.45);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      text-align: center;
    }

    /* the "Tudo num só lugar." line is styled differently */
    .word-bridge {
      font-size: 22px;
      font-weight: 300;
      color: rgba(255,255,255,0.7);
      letter-spacing: -0.3px;
      text-align: center;
      line-height: 1.4;
    }

    .word-bridge strong {
      font-weight: 800;
      color: #ffffff;
    }

    /* ── LOGO LOCK ── */
    #logo-lock {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 3;
      opacity: 0;
      pointer-events: none;
    }

    .logo-icon {
      width: 76px;
      height: 76px;
      background: rgba(255,255,255,0.12);
      border: 1.5px solid rgba(255,255,255,0.2);
      border-radius: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      backdrop-filter: blur(12px);
    }

    .logo-icon svg {
      width: 36px;
      height: 36px;
    }

    .logo-name {
      font-size: 36px;
      font-weight: 900;
      color: #ffffff;
      letter-spacing: -1.2px;
      margin-bottom: 8px;
    }

    .logo-name span {
      color: rgba(255,255,255,0.5);
    }

    .logo-tagline {
      font-size: 11px;
      font-weight: 500;
      color: rgba(255,255,255,0.35);
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    /* thin gold line beneath logo */
    .logo-line {
      width: 0px;
      height: 2px;
      background: rgba(255,255,255,0.2);
      border-radius: 99px;
      margin-top: 32px;
      transition: width 0.6s ease;
    }

    .logo-line.grow {
      width: 48px;
    }

    /* ── BOTTOM BRAND ── */
    .splash-brand {
      position: absolute;
      bottom: 28px;
      font-size: 10px;
      font-weight: 500;
      color: rgba(255,255,255,0.18);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      z-index: 4;
      opacity: 0;
    }

    /* ── ANIMATIONS ── */

    /* word flash in */
    @keyframes wordIn {
      0%   { opacity: 0; transform: translateY(14px); }
      15%  { opacity: 1; transform: translateY(0); }
      75%  { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(-10px); }
    }

    /* bridge line — stays a bit longer */
    @keyframes bridgeIn {
      0%   { opacity: 0; transform: translateY(10px); }
      12%  { opacity: 1; transform: translateY(0); }
      80%  { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(-8px); }
    }

    /* logo locks in */
    @keyframes logoIn {
      0%   { opacity: 0; transform: scale(0.88); }
      60%  { opacity: 1; transform: scale(1.02); }
      100% { opacity: 1; transform: scale(1); }
    }

    /* brand line fades */
    @keyframes brandIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    /* replay btn */
    .replay-btn {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255,255,255,0.08);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.15);
      padding: 10px 28px;
      border-radius: 50px;
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      backdrop-filter: blur(12px);
      transition: background 0.2s;
      z-index: 999;
      white-space: nowrap;
    }
    .replay-btn:hover { background: rgba(255,255,255,0.16); }
  </style>
</head>
<body>

  <div class="phone-frame">
    <div id="pwa-splash">

      <!-- WORD STAGE -->
      <div id="word-stage">

        <div class="word-line" id="w1">
          <div class="word-main">ACs.</div>
          <div class="word-sub">Avaliações Contínuas</div>
        </div>

        <div class="word-line" id="w2">
          <div class="word-main">AT.</div>
          <div class="word-sub">Avaliação Trimestral</div>
        </div>

        <div class="word-line" id="w3">
          <div class="word-main">Fichas.</div>
          <div class="word-sub">Exercícios e Revisão</div>
        </div>

        <div class="word-line" id="w4">
          <div class="word-main">Exames.</div>
          <div class="word-sub">Preparação Oficial</div>
        </div>

        <div class="word-line" id="w5">
          <div class="word-bridge">
            Tudo o que precisas.<br>
            <strong>Num só lugar.</strong>
          </div>
        </div>

      </div>

      <!-- LOGO LOCK -->
      <div id="logo-lock">
        <div class="logo-icon">
          <!-- pen + document SVG inline -->
          <svg viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="6" y="4" width="18" height="24" rx="3" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.6)" stroke-width="1.5"/>
            <path d="M10 10h10M10 14h10M10 18h6" stroke="rgba(255,255,255,0.7)" stroke-width="1.5" stroke-linecap="round"/>
            <path d="M23 20l7-7-3-3-7 7v3h3z" fill="rgba(255,179,0,0.9)" stroke="rgba(255,179,0,1)" stroke-width="0.5" stroke-linejoin="round"/>
          </svg>
        </div>
        <div class="logo-name">Prova<span>Nova</span></div>
        <div class="logo-tagline">Plataforma Docente</div>
        <div class="logo-line" id="logo-line"></div>
      </div>

      <!-- BRAND -->
      <div class="splash-brand" id="splash-brand">
        © <span id="splash-year"></span> ProvaNova
      </div>

    </div>
  </div>

  <button class="replay-btn" onclick="startSplash()">↺ Replay</button>

  <script>
    document.getElementById('splash-year').textContent = new Date().getFullYear();

    const wait = ms => new Promise(r => setTimeout(r, ms));

    function clearAll() {
      for (let i = 1; i <= 5; i++) {
        const w = document.getElementById('w' + i);
        w.style.animation = 'none';
        w.style.opacity = '0';
      }
      const logo = document.getElementById('logo-lock');
      logo.style.animation = 'none';
      logo.style.opacity = '0';

      const line = document.getElementById('logo-line');
      line.classList.remove('grow');

      const brand = document.getElementById('splash-brand');
      brand.style.animation = 'none';
      brand.style.opacity = '0';
    }

    function flashWord(id, duration, isLast = false) {
      return new Promise(resolve => {
        const el = document.getElementById(id);
        el.style.animation = 'none';
        el.style.opacity = '0';

        requestAnimationFrame(() => {
          requestAnimationFrame(() => {
            const anim = isLast ? 'bridgeIn' : 'wordIn';
            el.style.animation = `${anim} ${duration}ms ease forwards`;
            setTimeout(resolve, duration * 0.85);
          });
        });
      });
    }

    async function startSplash() {
      clearAll();
      await wait(120);

      // ── Word sequence ──
      // Each word: animation duration, time before next starts
      await flashWord('w1', 820);
      await wait(20);
      await flashWord('w2', 820);
      await wait(20);
      await flashWord('w3', 820);
      await wait(20);
      await flashWord('w4', 820);
      await wait(60);

      // Bridge line — stays longer
      await flashWord('w5', 1100, true);
      await wait(200);

      // ── Logo locks in ──
      const logo = document.getElementById('logo-lock');
      logo.style.animation = 'logoIn 0.65s cubic-bezier(0.34, 1.2, 0.64, 1) forwards';

      await wait(400);

      // Line grows under logo
      document.getElementById('logo-line').classList.add('grow');

      await wait(300);

      // Brand fades in
      const brand = document.getElementById('splash-brand');
      brand.style.animation = 'brandIn 0.5s ease forwards';
    }

    startSplash();
  </script>

</body>
</html>
