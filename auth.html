<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Entrar - DoveLingua</title>
<link rel="icon" type="image/png" sizes="32x32" href="https://download.dovelingua.com/website/Favicon_32x32.png">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
/* ... your existing styles ... */
</style>
</head>
<body>
<!-- ... your existing HTML structure ... -->

<script type="module">
import { 
  authStateListener, 
  signInWithEmail, 
  signInWithGoogle,
  signUpWithEmail,
  signOutUser,
  sendPasswordReset,
  createUserDocument,
  getUserRole,
  isUserBlocked,
  getRouteForRole,
  getErrorMessage,
  updateUserProfile,
  db
} from "./auth-functions.js";
import { doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore.js";

// Your existing DOM references and utility functions
let _justRegistered = false;

function showError(msg, id='errorBanner'){ 
  const el=document.getElementById(id); 
  if(!el)return; 
  el.textContent=msg; 
  el.classList.add('show'); 
  clearTimeout(errorTimer); 
  errorTimer=setTimeout(()=>el.classList.remove('show'),6000); 
}

function hideError(id='errorBanner'){ 
  document.getElementById(id)?.classList.remove('show'); 
}

function setLoading(btnId,on){ 
  const b=document.getElementById(btnId); 
  if(!b)return; 
  b.disabled=on; 
  b.classList.toggle('loading',on); 
}

function showFieldError(id,msg){ 
  const el=document.getElementById(id); 
  if(!el)return; 
  el.textContent=msg; 
  el.classList.add('show'); 
}

function clearFieldErrors(){ 
  document.querySelectorAll('.field-error').forEach(e=>{
    e.textContent='';
    e.classList.remove('show');
  }); 
  document.querySelectorAll('.field input').forEach(e=>e.classList.remove('input-error')); 
}

function showSuccessAndRedirect(role){
  document.getElementById('registerForm').style.display = 'none';
  document.getElementById('registerSuccess').classList.add('show');
  setTimeout(() => {
    window.location.href = getRouteForRole(role);
  }, 1500);
}

// Check blocked status on load
if (new URLSearchParams(window.location.search).get('blocked') === '1') {
  document.getElementById('blockedBanner').classList.add('show');
}

// Auth state listener
authStateListener(async (user) => {
  if (!user || _justRegistered) return;
  
  try {
    const userData = await getUserRole(user);
    if (!userData) return;
    
    if (userData.isBlocked) {
      await signOutUser();
      window.location.href = 'auth.html?blocked=1';
      return;
    }
    
    window.location.href = getRouteForRole(userData.role);
  } catch (e) {
    window.location.href = 'application-status.html';
  }
});

// Global functions
window.signInGoogle = async function(){
  hideError(); 
  setLoading('btnGoogleLogin', true);
  try {
    const result = await signInWithGoogle();
    const userData = await getUserRole(result.user);
    
    if (!userData) {
      _justRegistered = true;
      const safeName = result.user.displayName || result.user.email?.split('@')[0] || 'Aluno';
      const role = await createUserDocument(result.user.uid, safeName, result.user.email, null);
      showSuccessAndRedirect(role);
    } else {
      if (userData.isBlocked) {
        await signOutUser();
        window.location.href='auth.html?blocked=1';
        return;
      }
      window.location.href = getRouteForRole(userData.role);
    }
  } catch (e) {
    _justRegistered = false;
    if (e.code !== 'auth/popup-closed-by-user') showError(getErrorMessage(e.code));
  } finally { 
    setLoading('btnGoogleLogin', false); 
  }
};

window.signInEmail = async function(){
  hideError(); 
  clearFieldErrors();
  const email = document.getElementById('loginEmail').value.trim();
  const pwd = document.getElementById('loginPassword').value;
  let err = false;
  
  if (!email) { 
    showFieldError('errLoginEmail','⚠️ Introduz o teu endereço de email.'); 
    document.getElementById('loginEmail').classList.add('input-error'); 
    err=true; 
  }
  if (!pwd) { 
    showFieldError('errLoginPassword','⚠️ Introduz a sua palavra-passe.'); 
    document.getElementById('loginPassword').classList.add('input-error'); 
    err=true; 
  }
  if (err) return;
  
  setLoading('btnEmailLogin', true);
  try {
    const result = await signInWithEmail(email, pwd);
    const userData = await getUserRole(result.user);
    window.location.href = getRouteForRole(userData?.role);
  } catch (e) { 
    showError(getErrorMessage(e.code)); 
  } finally { 
    setLoading('btnEmailLogin', false); 
  }
};

window.registerEmail = async function(){
  hideError(); 
  clearFieldErrors();
  const name = document.getElementById('regName').value.trim();
  const email = document.getElementById('regEmail').value.trim();
  const phone = document.getElementById('regPhone').value.trim();
  const pwd = document.getElementById('regPassword').value;
  const confirm = document.getElementById('regConfirm').value;
  const parts = name.split(' ').filter(p => p.length > 0);
  let err = false;

  if (!name) { 
    showFieldError('errRegName','⚠️ Por favor escreve o teu nome completo.'); 
    document.getElementById('regName').classList.add('input-error'); 
    err=true; 
  }
  else if (parts.length < 2) { 
    showFieldError('errRegName','⚠️ Escreve o teu nome e apelido.'); 
    document.getElementById('regName').classList.add('input-error'); 
    err=true; 
  }

  if (!email) { 
    showFieldError('errRegEmail','⚠️ Por favor introduz o teu email.'); 
    document.getElementById('regEmail').classList.add('input-error'); 
    err=true; 
  }
  else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { 
    showFieldError('errRegEmail','⚠️ Email inválido.'); 
    document.getElementById('regEmail').classList.add('input-error'); 
    err=true; 
  }

  if (!phone) { 
    showFieldError('errRegPhone','⚠️ Por favor introduz o teu número de WhatsApp.'); 
    document.getElementById('regPhone').classList.add('input-error'); 
    err=true; 
  }

  if (!pwd) { 
    showFieldError('errRegPassword','⚠️ Por favor cria uma palavra-passe.'); 
    document.getElementById('regPassword').classList.add('input-error'); 
    err=true; 
  }
  else if (pwd.length < 6) { 
    showFieldError('errRegPassword','⚠️ Mínimo 6 caracteres.'); 
    document.getElementById('regPassword').classList.add('input-error'); 
    err=true; 
  }

  if (!confirm) { 
    showFieldError('errRegConfirm','⚠️ Confirma a sua palavra-passe.'); 
    document.getElementById('regConfirm').classList.add('input-error'); 
    err=true; 
  }
  else if (pwd !== confirm) { 
    showFieldError('errRegConfirm','⚠️ As palavras-passe não coincidem.'); 
    document.getElementById('regConfirm').classList.add('input-error'); 
    err=true; 
  }

  if (err) return;

  _justRegistered = true;
  setLoading('btnEmailRegister', true);
  try {
    const cred = await signUpWithEmail(email, pwd);
    await updateUserProfile(cred.user, { displayName: name });
    const role = await createUserDocument(cred.user.uid, name, email, phone);
    showSuccessAndRedirect(role);
  } catch (e) { 
    _justRegistered = false; 
    showError(getErrorMessage(e.code)); 
  } finally { 
    setLoading('btnEmailRegister', false); 
  }
};

window.registerGoogle = async function(){
  hideError(); 
  setLoading('btnGoogleRegister', true);
  try {
    const result = await signInWithGoogle();
    const userData = await getUserRole(result.user);
    
    if (userData) {
      if (userData.isBlocked) {
        await signOutUser();
        window.location.href='auth.html?blocked=1';
        return;
      }
      window.location.href = getRouteForRole(userData.role);
      return;
    }
    
    _justRegistered = true;
    const safeName = result.user.displayName || result.user.email?.split('@')[0] || 'Aluno';
    const role = await createUserDocument(result.user.uid, safeName, result.user.email, null);
    showSuccessAndRedirect(role);
  } catch (e) {
    _justRegistered = false;
    if (e.code !== 'auth/popup-closed-by-user') showError(getErrorMessage(e.code));
  } finally { 
    setLoading('btnGoogleRegister', false); 
  }
};

window.openResetModal = function(){
  const e = document.getElementById('loginEmail').value.trim();
  if (e) document.getElementById('resetEmail').value = e;
  document.getElementById('resetModal').classList.add('show');
};

window.closeResetModal = function(){ 
  document.getElementById('resetModal').classList.remove('show'); 
};

window.sendResetEmail = async function(){
  hideError('resetError');
  const email = document.getElementById('resetEmail').value.trim();
  if (!email) { 
    showError('Introduz o teu email.', 'resetError'); 
    return; 
  }
  setLoading('btnSendReset', true);
  try {
    await sendPasswordReset(email);
    document.getElementById('resetSuccess').textContent = 'Email enviado! Verifica a sua caixa de entrada.';
    document.getElementById('resetSuccess').classList.add('show');
  } catch (e) { 
    showError(getErrorMessage(e.code), 'resetError'); 
  } finally { 
    setLoading('btnSendReset', false); 
  }
};

window.switchTab = function(tab){
  hideError();
  document.getElementById('sectionLogin').classList.toggle('active', tab==='login');
  document.getElementById('sectionRegister').classList.toggle('active', tab==='register');
  document.getElementById('tabLogin').classList.toggle('active', tab==='login');
  document.getElementById('tabRegister').classList.toggle('active', tab==='register');
};

window.togglePw = function(id, btn){
  const inp = document.getElementById(id);
  const show = inp.type === 'password';
  inp.type = show ? 'text' : 'password';
  btn.innerHTML = show ? '<i class="fa-solid fa-eye-slash"></i>' : '<i class="fa-solid fa-eye"></i>';
};
</script>
<script src="/key-lock.js"></script>
</body>
</html>
