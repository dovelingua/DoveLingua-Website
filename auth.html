<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";
import { 
  getAuth, 
  createUserWithEmailAndPassword, 
  signInWithEmailAndPassword, 
  signInWithPopup, 
  GoogleAuthProvider, 
  updateProfile, 
  sendPasswordResetEmail, 
  onAuthStateChanged, 
  signOut 
} from "https://www.gstatic.com/firebasejs/12.15.0/firebase-auth.js";
import { 
  getFirestore, 
  doc, 
  setDoc, 
  getDoc, 
  serverTimestamp 
} from "https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore.js";

// ============================================
// FIREBASE CONFIGURATION - SINGLE SOURCE OF TRUTH
// ============================================
const firebaseConfig = {
  apiKey: "AIzaSyAl9A_gXDKTB3N6U1f_Bh5FWrOsySjCJGo",
  authDomain: "dovelingua-site.firebaseapp.com",
  projectId: "dovelingua-site",
  storageBucket: "dovelingua-site.firebasestorage.app",
  messagingSenderId: "271742052334",
  appId: "1:271742052334:web:bc736373d7ea50001b50ff",
  measurementId: "G-N8ELT8SMYM"
};

// Initialize Firebase (ONLY HERE)
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const provider = new GoogleAuthProvider();

// ============================================
// CONFIGURATION
// ============================================
const ADMIN_EMAILS = ['your-admin-email@example.com', 'second-admin@example.com'];

const ROUTES = { 
  applicant: 'application-status.html', 
  student: 'student-dashboard.html', 
  teacher: 'teacher-dashboard.html', 
  staff: 'staff-payments.html', 
  admin: 'admin-dashboard.html' 
};

const ERR = {
  'auth/email-already-in-use': 'Este email já está registado. Tente iniciar sessão.',
  'auth/invalid-email': 'O formato do email não é válido.',
  'auth/weak-password': 'Usa pelo menos 6 caracteres na palavra-passe.',
  'auth/network-request-failed': 'Sem ligação à internet. Verifica a sua ligação.',
  'auth/user-not-found': 'Não encontrámos nenhuma conta com este email.',
  'auth/wrong-password': 'Palavra-passe incorrecta.',
  'auth/too-many-requests': 'Demasiadas tentativas. Aguarda alguns minutos.',
  'auth/invalid-credential': 'Email ou palavra-passe incorrectos. Se criou a conta com o Google, usa o botão "Continuar com o Google".'
};

// ============================================
// EXPORTED FUNCTIONS - Available to all other files
// ============================================
export function getErrorMessage(code) {
  return ERR[code] || 'Ocorreu um erro inesperado. Tenta novamente.';
}

export async function createUserDocument(uid, name, email, phone) {
  const role = ADMIN_EMAILS.includes(email) ? 'admin' : 'applicant';
  await setDoc(doc(db, 'users', uid), {
    uid,
    fullName: name || 'Aluno',
    email,
    phone: phone || null,
    role: role,
    status: 'active',
    createdAt: serverTimestamp()
  });
  return role;
}

export async function getUserRole(user) {
  if (!user) return null;
  const snap = await getDoc(doc(db, 'users', user.uid));
  if (!snap.exists()) return null;
  return snap.data();
}

export async function isUserBlocked(user) {
  if (!user) return false;
  const snap = await getDoc(doc(db, 'users', user.uid));
  if (!snap.exists()) return false;
  return snap.data().isBlocked === true;
}

export function signInWithEmail(email, password) {
  return signInWithEmailAndPassword(auth, email, password);
}

export function signUpWithEmail(email, password) {
  return createUserWithEmailAndPassword(auth, email, password);
}

export function signInWithGoogle() {
  return signInWithPopup(auth, provider);
}

export function signOutUser() {
  return signOut(auth);
}

export function sendPasswordReset(email) {
  return sendPasswordResetEmail(auth, email);
}

export function updateUserProfile(user, data) {
  return updateProfile(user, data);
}

export function authStateListener(callback) {
  return onAuthStateChanged(auth, callback);
}

export function getRouteForRole(role) {
  return ROUTES[role] || 'application-status.html';
}

// Export Firebase instances directly
export { app, auth, db, provider, ADMIN_EMAILS, ROUTES };

// ============================================
// AUTH.HTML UI LOGIC (Same as before)
// ============================================
let _justRegistered = false;

function showError(msg, id='errorBanner'){ 
  const el=document.getElementById(id); 
  if(!el)return; 
  el.textContent=msg; 
  el.classList.add('show'); 
  clearTimeout(errorTimer); 
  errorTimer=setTimeout(()=>el.classList.remove('show'),6000); 
}

function hideError(id='errorBanner'){ 
  document.getElementById(id)?.classList.remove('show'); 
}

function setLoading(btnId,on){ 
  const b=document.getElementById(btnId); 
  if(!b)return; 
  b.disabled=on; 
  b.classList.toggle('loading',on); 
}

function showFieldError(id,msg){ 
  const el=document.getElementById(id); 
  if(!el)return; 
  el.textContent=msg; 
  el.classList.add('show'); 
}

function clearFieldErrors(){ 
  document.querySelectorAll('.field-error').forEach(e=>{
    e.textContent='';
    e.classList.remove('show');
  }); 
  document.querySelectorAll('.field input').forEach(e=>e.classList.remove('input-error')); 
}

function showSuccessAndRedirect(role){
  document.getElementById('registerForm').style.display = 'none';
  document.getElementById('registerSuccess').classList.add('show');
  setTimeout(() => {
    window.location.href = getRouteForRole(role);
  }, 1500);
}

// Check blocked status
if (new URLSearchParams(window.location.search).get('blocked') === '1') {
  document.getElementById('blockedBanner').classList.add('show');
}

// Auth state listener
authStateListener(async (user) => {
  if (!user || _justRegistered) return;
  
  try {
    const userData = await getUserRole(user);
    if (!userData) return;
    
    if (userData.isBlocked) {
      await signOutUser();
      window.location.href = 'auth.html?blocked=1';
      return;
    }
    
    window.location.href = getRouteForRole(userData.role);
  } catch (e) {
    window.location.href = 'application-status.html';
  }
});

// Global functions for onclick handlers
window.signInGoogle = async function(){
  hideError(); 
  setLoading('btnGoogleLogin', true);
  try {
    const result = await signInWithGoogle();
    const userData = await getUserRole(result.user);
    
    if (!userData) {
      _justRegistered = true;
      const safeName = result.user.displayName || result.user.email?.split('@')[0] || 'Aluno';
      const role = await createUserDocument(result.user.uid, safeName, result.user.email, null);
      showSuccessAndRedirect(role);
    } else {
      if (userData.isBlocked) {
        await signOutUser();
        window.location.href='auth.html?blocked=1';
        return;
      }
      window.location.href = getRouteForRole(userData.role);
    }
  } catch (e) {
    _justRegistered = false;
    if (e.code !== 'auth/popup-closed-by-user') showError(getErrorMessage(e.code));
  } finally { 
    setLoading('btnGoogleLogin', false); 
  }
};

window.signInEmail = async function(){
  hideError(); 
  clearFieldErrors();
  const email = document.getElementById('loginEmail').value.trim();
  const pwd = document.getElementById('loginPassword').value;
  let err = false;
  
  if (!email) { 
    showFieldError('errLoginEmail','⚠️ Introduz o teu endereço de email.'); 
    document.getElementById('loginEmail').classList.add('input-error'); 
    err=true; 
  }
  if (!pwd) { 
    showFieldError('errLoginPassword','⚠️ Introduz a sua palavra-passe.'); 
    document.getElementById('loginPassword').classList.add('input-error'); 
    err=true; 
  }
  if (err) return;
  
  setLoading('btnEmailLogin', true);
  try {
    const result = await signInWithEmail(email, pwd);
    const userData = await getUserRole(result.user);
    window.location.href = getRouteForRole(userData?.role);
  } catch (e) { 
    showError(getErrorMessage(e.code)); 
  } finally { 
    setLoading('btnEmailLogin', false); 
  }
};

window.registerEmail = async function(){
  hideError(); 
  clearFieldErrors();
  const name = document.getElementById('regName').value.trim();
  const email = document.getElementById('regEmail').value.trim();
  const phone = document.getElementById('regPhone').value.trim();
  const pwd = document.getElementById('regPassword').value;
  const confirm = document.getElementById('regConfirm').value;
  const parts = name.split(' ').filter(p => p.length > 0);
  let err = false;

  if (!name) { 
    showFieldError('errRegName','⚠️ Por favor escreve o teu nome completo.'); 
    document.getElementById('regName').classList.add('input-error'); 
    err=true; 
  }
  else if (parts.length < 2) { 
    showFieldError('errRegName','⚠️ Escreve o teu nome e apelido.'); 
    document.getElementById('regName').classList.add('input-error'); 
    err=true; 
  }

  if (!email) { 
    showFieldError('errRegEmail','⚠️ Por favor introduz o teu email.'); 
    document.getElementById('regEmail').classList.add('input-error'); 
    err=true; 
  }
  else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { 
    showFieldError('errRegEmail','⚠️ Email inválido.'); 
    document.getElementById('regEmail').classList.add('input-error'); 
    err=true; 
  }

  if (!phone) { 
    showFieldError('errRegPhone','⚠️ Por favor introduz o teu número de WhatsApp.'); 
    document.getElementById('regPhone').classList.add('input-error'); 
    err=true; 
  }

  if (!pwd) { 
    showFieldError('errRegPassword','⚠️ Por favor cria uma palavra-passe.'); 
    document.getElementById('regPassword').classList.add('input-error'); 
    err=true; 
  }
  else if (pwd.length < 6) { 
    showFieldError('errRegPassword','⚠️ Mínimo 6 caracteres.'); 
    document.getElementById('regPassword').classList.add('input-error'); 
    err=true; 
  }

  if (!confirm) { 
    showFieldError('errRegConfirm','⚠️ Confirma a sua palavra-passe.'); 
    document.getElementById('regConfirm').classList.add('input-error'); 
    err=true; 
  }
  else if (pwd !== confirm) { 
    showFieldError('errRegConfirm','⚠️ As palavras-passe não coincidem.'); 
    document.getElementById('regConfirm').classList.add('input-error'); 
    err=true; 
  }

  if (err) return;

  _justRegistered = true;
  setLoading('btnEmailRegister', true);
  try {
    const cred = await signUpWithEmail(email, pwd);
    await updateUserProfile(cred.user, { displayName: name });
    const role = await createUserDocument(cred.user.uid, name, email, phone);
    showSuccessAndRedirect(role);
  } catch (e) { 
    _justRegistered = false; 
    showError(getErrorMessage(e.code)); 
  } finally { 
    setLoading('btnEmailRegister', false); 
  }
};

window.registerGoogle = async function(){
  hideError(); 
  setLoading('btnGoogleRegister', true);
  try {
    const result = await signInWithGoogle();
    const userData = await getUserRole(result.user);
    
    if (userData) {
      if (userData.isBlocked) {
        await signOutUser();
        window.location.href='auth.html?blocked=1';
        return;
      }
      window.location.href = getRouteForRole(userData.role);
      return;
    }
    
    _justRegistered = true;
    const safeName = result.user.displayName || result.user.email?.split('@')[0] || 'Aluno';
    const role = await createUserDocument(result.user.uid, safeName, result.user.email, null);
    showSuccessAndRedirect(role);
  } catch (e) {
    _justRegistered = false;
    if (e.code !== 'auth/popup-closed-by-user') showError(getErrorMessage(e.code));
  } finally { 
    setLoading('btnGoogleRegister', false); 
  }
};

window.openResetModal = function(){
  const e = document.getElementById('loginEmail').value.trim();
  if (e) document.getElementById('resetEmail').value = e;
  document.getElementById('resetModal').classList.add('show');
};

window.closeResetModal = function(){ 
  document.getElementById('resetModal').classList.remove('show'); 
};

window.sendResetEmail = async function(){
  hideError('resetError');
  const email = document.getElementById('resetEmail').value.trim();
  if (!email) { 
    showError('Introduz o teu email.', 'resetError'); 
    return; 
  }
  setLoading('btnSendReset', true);
  try {
    await sendPasswordReset(email);
    document.getElementById('resetSuccess').textContent = 'Email enviado! Verifica a sua caixa de entrada.';
    document.getElementById('resetSuccess').classList.add('show');
  } catch (e) { 
    showError(getErrorMessage(e.code), 'resetError'); 
  } finally { 
    setLoading('btnSendReset', false); 
  }
};

window.switchTab = function(tab){
  hideError();
  document.getElementById('sectionLogin').classList.toggle('active', tab==='login');
  document.getElementById('sectionRegister').classList.toggle('active', tab==='register');
  document.getElementById('tabLogin').classList.toggle('active', tab==='login');
  document.getElementById('tabRegister').classList.toggle('active', tab==='register');
};

window.togglePw = function(id, btn){
  const inp = document.getElementById(id);
  const show = inp.type === 'password';
  inp.type = show ? 'text' : 'password';
  btn.innerHTML = show ? '<i class="fa-solid fa-eye-slash"></i>' : '<i class="fa-solid fa-eye"></i>';
};
</script>
<script src="/key-lock.js"></script>
</body>
</html>
